name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.2
  NODE_VERSION: 24.14.1
  GORELEASER_VERSION: v2.18.0

jobs:
  go:
    name: Go, format, lint, and race
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install pinned Go verification tools
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.44.0
          go install mvdan.cc/gofumpt@v0.9.2
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
      - name: Check workflow syntax
        run: scripts/actionlint.sh .github/workflows/*.yml
      - name: Check product boundary
        run: sh scripts/verify-product-boundary.sh
      - name: Check version-shaped builds
        run: sh scripts/verify-version-builds.sh
      - name: Check formatting
        run: make fmt-check
      - name: Lint
        run: make lint
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./internal/...

  related-performance:
    name: Fixed related performance budgets
    runs-on: ubuntu-24.04
    env:
      OBSITE_RELATED_PERF: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify related performance budgets
        run: go test ./internal/recommend ./internal/build -run '^TestRelatedPerformanceBudgets$' -count=1 -timeout=60m

  browser:
    name: Fixed Chromium offline E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:editor
      - name: Install lockfile-pinned Chromium
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload E2E test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore

  snapshot:
    name: Six-platform snapshot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check
      - name: Build snapshot
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean
      - name: Verify snapshot artifacts
        run: sh scripts/verify-release.sh dist
      - name: Retain snapshot report and artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/metadata.json
          if-no-files-found: error

  native-smoke:
    name: Native smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build native release-shaped binary
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: build --snapshot --clean --single-target
      - name: Smoke init, build, and serve
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary=$(find dist -type f -name obsite | head -n 1)
          test -n "$binary"
          scripts/smoke-release.sh "$binary"
      - name: Smoke init, build, and serve
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = (Get-ChildItem -Path dist -Recurse -Filter obsite.exe | Select-Object -First 1).FullName
          if (-not $binary) { throw 'native release binary not found' }
          ./scripts/smoke-release.ps1 -Binary $binary
