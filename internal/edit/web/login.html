<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Obsite</title>
  <link rel="stylesheet" href="/_obsite/login.css">
</head>
<body>
  <main class="login-card">
    <a class="brand" href="__OBSITE_BASE_PATH__" aria-label="Back to site">Obsite</a>
    <p class="eyebrow">Content workspace</p>
    <h1>Welcome back</h1>
    <p class="intro">Log in to write, organize, and publish your Markdown.</p>
    <form method="post" action="/_obsite/login">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
    <p class="footer">Your vault. Your words. Your site.</p>
  </main>
</body>
</html>
