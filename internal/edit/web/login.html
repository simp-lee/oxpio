<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · OXPIO</title>
  <link rel="icon" href="/_oxpio/favicon.svg" type="image/svg+xml">
  <script src="/_oxpio/theme.js"></script>
  <link rel="stylesheet" href="/_oxpio/tokens.css">
  <link rel="stylesheet" href="/_oxpio/login.css">
</head>
<body>
  <main class="login-card">
    <a class="brand" href="__OXPIO_BASE_PATH__" aria-label="Back to OXPIO"><img src="/_oxpio/logo.svg" alt="OXPIO"></a>
    <p class="eyebrow">Content workspace</p>
    <h1>Welcome back</h1>
    <p class="intro">Log in to write, organize, and publish your Markdown.</p>
    <div class="theme-control"><label for="theme-preference">Theme</label><select id="theme-preference" data-theme-select><option value="system">Follow system</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
    <p class="login-error"__OXPIO_LOGIN_ERROR_HIDDEN__ role="alert">__OXPIO_LOGIN_ERROR__</p>
    <form method="post" action="/_oxpio/login">
      <input type="hidden" name="next" value="__OXPIO_LOGIN_NEXT__">
      <input type="hidden" name="response" value="html">
      <label for="username">Username</label>
      <input id="username" name="username" value="__OXPIO_LOGIN_USERNAME__" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
    <p class="footer">Your vault. Your words. Your site.</p>
  </main>
</body>
</html>
